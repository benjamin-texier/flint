# Development: hot reload on both sides, against a throwaway ClickHouse seeded
# with ClickHouse's own example schemas from contrib/play-schema.sql.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Then open http://localhost:5173 — the Vite dev server, which proxies /api to
# the backend. The backend is also on http://localhost:8080 if you want to hit
# the API directly.
#
# The throwaway ClickHouse is published on :8125, not its usual :8123, because
# anyone working on Flint almost certainly already has a ClickHouse on 8123 and
# the stack would refuse to start. Every published port here can be overridden
# (FLINT_DEV_CLICKHOUSE_PORT, FLINT_DEV_API_PORT, FLINT_DEV_WEB_PORT).
#
# To develop against your own ClickHouse instead, drop the clickhouse service
# from `depends_on` and point FLINT_CLICKHOUSE_URL at it.
#
# The cargo-registry and cargo-target volumes are what make this bearable: they
# keep the dependency build between runs, so `up` after the first one is fast.

name: flint-dev

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_PASSWORD: flint
    volumes:
      # The official image applies everything in this directory on first boot.
      #
      # ClickHouse's own example schemas — 85 tables and 5 views taken from
      # play.clickhouse.com, with an extract of the data behind each. A fixture
      # written here would only ever show Flint the shapes Flint expects; these
      # were built by people who have never heard of it, which is the point.
      # Regenerate with `node contrib/pull-play.mjs > contrib/play-schema.sql`.
      #
      # It needs the network on first boot: the DDL is in the file, the rows are
      # not — about 150 MiB of them, fetched by the server itself over the
      # playground's native port. A first `up` with no route to it comes up with
      # the schema and no data, which the pages will say rather than hide.
      - ./contrib/play-schema.sql:/docker-entrypoint-initdb.d/10-play-schema.sql:ro
      # A second user, granted almost nothing. Flint has a lot of behaviour that
      # only appears when it is refused — `Reach` telling a missing table from a
      # missing grant, every diagnostic naming the grant it needs — and none of
      # it is reachable while signed in as an account allowed everything.
      - ./contrib/dev-users.xml:/etc/clickhouse-server/users.d/flint-probe.xml:ro
      # A cluster on paper: `system.clusters` is configuration, so this gives the
      # Clusters page a real ring — two shards, a local replica, and one endpoint
      # that is not there — without needing a Keeper or a second server.
      - ./contrib/dev-cluster.xml:/etc/clickhouse-server/config.d/flint-cluster.xml:ro
      # A destination for BACKUP. Without one the server refuses the statement
      # outright, `system.backups` stays empty, and a backup screen developed
      # against that has never seen a backup.
      - ./contrib/dev-backups.xml:/etc/clickhouse-server/config.d/flint-backups.xml:ro
      # A second volume, so tiering can be seen at all. `MOVE PARTITION TO
      # VOLUME` was left out of Flint on the grounds that this server had one
      # disk; this is the fixture that removed the excuse.
      - ./contrib/dev-storage.xml:/etc/clickhouse-server/config.d/flint-storage.xml:ro
      # SQL-driven access control, which a stock server does not allow: without
      # it `CREATE USER` is code 497 and no quota, profile or row policy can
      # exist to look at. `contrib/dev-access.sql` then creates one of each.
      - ./contrib/dev-access.xml:/etc/clickhouse-server/users.d/flint-access.xml:ro
      - ./contrib/dev-access.sql:/docker-entrypoint-initdb.d/20-dev-access.sql:ro
      # Three dictionaries in the three states worth looking at. A stock server
      # has none, so the page that reads them shows an empty table whether it
      # works or not — and the state it exists for cannot be reasoned about
      # without producing it.
      - ./contrib/dev-dictionaries.sql:/docker-entrypoint-initdb.d/30-dev-dictionaries.sql:ro
      # A workload, so the projection advisor has a query log to read. It reads
      # `system.query_log` and nothing else, so on a server nobody has queried
      # its correct answer — "nothing has touched this table" — is the same
      # empty panel a broken advisor would show. Numbered last: every statement
      # in it queries the tables the schema script creates and fills.
      - ./contrib/dev-workload.sql:/docker-entrypoint-initdb.d/40-dev-workload.sql:ro
      # One table per kind of "somewhere else": a bucket, a URL, a file, three
      # databases, a Redis and a Kafka topic. None of their hosts resolves and
      # none of them needs to — the address is metadata, and reading it back is
      # the whole of what the object page has to say about a table whose rows
      # are not here.
      - ./contrib/dev-external.sql:/docker-entrypoint-initdb.d/50-dev-external.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - '${FLINT_DEV_CLICKHOUSE_PORT:-8125}:8123'
    # Probed over the container's own network interface, not its loopback.
    # While the entrypoint applies the init scripts it runs a temporary server
    # bound to 127.0.0.1: a loopback check goes green there, several seconds
    # before any sibling container can connect, and `depends_on` would release
    # the API into a connection refused. Measured at 1s resolution, the gap is
    # about three seconds.
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --host "$$(hostname)" --password flint --query "SELECT 1"
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 3s

  api:
    build:
      context: .
      target: dev
    working_dir: /app
    command: cargo watch --why -w src -w Cargo.toml -x run
    environment:
      FLINT_HOST: 0.0.0.0
      FLINT_CLICKHOUSE_URL: http://clickhouse:8123
      FLINT_CLICKHOUSE_PASSWORD: flint
      FLINT_CLICKHOUSE_DATABASE: analytics
      # Somewhere for Flint to keep its own things. Without it the dev stack runs
      # stateless, which is a supported mode and the wrong default here: five of
      # Data's sections — Home, Dashboards, Alerts, Reports, APIs — are then
      # absent from the bar, so the half of the product that keeps anything is
      # never once seen while it is being built. Same reasoning as the
      # dictionaries and the backup disk below: a state you cannot produce is a
      # state nobody reasons about.
      FLINT_WORKSPACE_DATABASE: flint
      # Writes are allowed in development: you want to be able to try them.
      FLINT_READONLY: 'false'
      # The dev server is a different origin, so the API has to allow it.
      FLINT_CORS_ORIGIN: http://localhost:5173
      FLINT_LOG: flint=debug,tower_http=warn
      CARGO_TARGET_DIR: /target
    volumes:
      - ./src:/app/src:ro
      - ./build.rs:/app/build.rs:ro
      - ./Cargo.toml:/app/Cargo.toml:ro
      # Writable so cargo can refresh it if a dependency moves; Cargo.toml
      # stays read-only, so nothing changes it from inside by accident.
      - ./Cargo.lock:/app/Cargo.lock
      # rust-embed needs this to exist at compile time; build.rs writes a
      # placeholder into it, and the real UI is served by Vite in this setup.
      - flint-dist:/app/frontend/dist
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/target
    ports:
      - '${FLINT_DEV_API_PORT:-8080}:8080'
    depends_on:
      clickhouse:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    # `pnpm install` runs on every start because the lockfile may have changed
    # since the volume was populated; it is a no-op when nothing moved.
    command: bash -lc "corepack enable && pnpm install && pnpm dev"
    environment:
      # Inside compose the API is a sibling service, not localhost.
      FLINT_API_PROXY: http://api:8080
    volumes:
      - ./frontend:/app/frontend
      - frontend-modules:/app/frontend/node_modules
    ports:
      - '${FLINT_DEV_WEB_PORT:-5173}:5173'
    depends_on:
      - api

volumes:
  clickhouse-data:
  cargo-registry:
  cargo-target:
  frontend-modules:
  flint-dist:
