[package]
name = "flint"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The workspace ClickHouse doesn't ship with"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["macros", "http2"] }
# Already in the tree through reqwest. A direct dependency because the thing it
# replaced was a hand-written decoder, and a decoder is not the half of base64
# anyone gets right: the one here refused padding bits that the hand-written one
# silently accepted, which is how a cursor Flint never issued gets read as one
# it did.
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.2"
mime_guess = "2.0"
# Already in the tree four ways over — axum, url, reqwest, tower-http. The
# escaping of a filename somebody else named is exactly the kind of table this
# codebase's own rule says not to keep a second copy of.
percent-encoding = "2.3"
# `stream` is for exports and nothing else. Every other read is a bounded page
# that Flint parses; a download is a file whose whole point is being larger than
# a page, and buffering it here would put the user's table in Flint's memory on
# the way to their disk.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "gzip", "charset", "http2", "stream"] }
rust-embed = { version = "8.12", features = ["interpolate-folder-path"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# Already in the tree through rustls; a direct dependency adds no build and no
# supply chain, and a published token has to be hashed somewhere that is not
# ClickHouse — a token sent to the server to be hashed is a token in a query.
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Already in the tree through reqwest. A direct dependency because an endpoint a
# *browser* named has to be taken apart before it is dialled, and hand-parsing
# the thing a security check depends on is how the check gets it wrong.
url = "2.5"
uuid = { version = "1.20", features = ["v4", "serde"] }
webpki-roots = "1.0.9"

[dev-dependencies]
# Only to drive the router in tests: `oneshot` sends one request through the
# whole stack, which is the only way to prove the authentication gate is
# actually on a route rather than merely written down beside it.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
