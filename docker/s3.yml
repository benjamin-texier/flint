# An S3 endpoint, so backing up to object storage can be watched to work.
#
# `BACKUP … TO S3(...)` was the last thing left in the backups phase, and it is
# exactly the kind of feature that looks finished in code and has never moved a
# byte. This is the fixture that removes the excuse: a MinIO on the same network
# as the development ClickHouse, with a bucket already made.
#
#     docker compose -f docker/dev.yml -f docker/s3.yml up -d
#
# The credentials are worthless on purpose — they are in a file in the
# repository, like every other development password here.
services:
  # The S3 disk configuration belongs to this overlay and not to the base
  # compose, because ClickHouse **refuses to start** without the endpoint it
  # names: `Code: 499 … Not found address of host: s3 (DNS_ERROR)`, and the
  # server exits. Mounting it in `docker/dev.yml` made the development
  # ClickHouse unbootable unless MinIO happened to be up, which is a fine way to
  # lose a morning. A service and the configuration that depends on it belong in
  # one file.
  clickhouse:
    volumes:
      - ../contrib/dev-s3-backups.xml:/etc/clickhouse-server/config.d/flint-s3-backups.xml:ro
    depends_on:
      s3:
        condition: service_healthy

  s3:
    image: minio/minio:latest
    container_name: flint-s3
    command: server /data --console-address ':9091'
    environment:
      MINIO_ROOT_USER: flintkey
      MINIO_ROOT_PASSWORD: flintsecret
    ports:
      - '${FLINT_S3_PORT:-9100}:9000'
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - s3

  # Make the bucket, then get out of the way. ClickHouse's S3 disk does not
  # create one, and a backup to a bucket that is not there fails with an error
  # about the endpoint rather than about the bucket.
  s3-init:
    image: minio/minio:latest
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set flint http://s3:9000 flintkey flintsecret &&
             mc mb --ignore-existing flint/backups &&
             echo bucket ready"
    restart: 'no'
